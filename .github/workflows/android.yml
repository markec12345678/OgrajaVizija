name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug + release APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            GRADLE_BIN=./gradlew
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/g.zip"
            python3 -c "import zipfile,os;zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/g.zip').extractall(os.environ['RUNNER_TEMP']+'/gradle')"
            chmod +x "$RUNNER_TEMP/gradle/gradle-8.10.2/bin/gradle"
            GRADLE_BIN="$RUNNER_TEMP/gradle/gradle-8.10.2/bin/gradle"
          fi
          "$GRADLE_BIN" --no-daemon :app:assembleDebug :app:assembleRelease

      - name: JVM core tests (geometrija, zascita originala)
        working-directory: tools/jvmtest
        env:
          GRADLE_CACHE: ${{ github.workspace }}/android/build/../../.jvmtest-cache
        run: |
          # testi potrebujejo kotlin-compiler-embeddable; ce ga ni v gradle cacheu,
          # run_core_tests.sh ga prenese sam z Maven Central
          bash run_core_tests.sh || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk


  runtime-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          working-directory: android
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-results
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn

# Runtime smoke is intentionally gated behind the APK job.
