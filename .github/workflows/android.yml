name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest           # 7 GB RAM — dovolj za AGP + Compose
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug + release APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            GRADLE_BIN=./gradlew
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/g.zip"
            python3 -c "import zipfile,os;zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/g.zip').extractall(os.environ['RUNNER_TEMP']+'/gradle')"
            chmod +x "$RUNNER_TEMP/gradle/gradle-8.10.2/bin/gradle"
            GRADLE_BIN="$RUNNER_TEMP/gradle/gradle-8.10.2/bin/gradle"
          fi
          "$GRADLE_BIN" --no-daemon :app:assembleDebug :app:assembleRelease

      - name: JVM core tests (geometrija, zascita originala)
        working-directory: tools/jvmtest
        env:
          GRADLE_CACHE: ${{ github.workspace }}/android/build/../../.jvmtest-cache
        run: |
          # testi potrebujejo kotlin-compiler-embeddable; ce ga ni v gradle cacheu,
          # run_core_tests.sh ga prenese sam z Maven Central
          bash run_core_tests.sh || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
